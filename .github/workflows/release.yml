name: SteamPulse GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      prerelease:
        description: 'Markera som Pre-release'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build APK & Publish Release Page
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare Firebase config & Debug Keystore
        run: |
          rm -f "app/ google-services.json" "app/google-services(1).json"
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "116329660329",
              "project_id": "steampulse-5487d",
              "storage_bucket": "steampulse-5487d.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:116329660329:android:6321124d33eb4f302dceb8",
                  "android_client_info": {
                    "package_name": "com.ferrelicious.steampulse"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "116329660329-3pk93eilel8km7r1sh0u2q6lu9risl2h.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyC72mGEUGWay7DpqiVhWOaiNw8xO-Pe-Ow"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "116329660329-3pk93eilel8km7r1sh0u2q6lu9risl2h.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "================ SHA-1 FINGERPRINT ================"
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android | grep "SHA1:"
          echo "==================================================="

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Resolve release tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release Page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.TAG }}
          name: "SteamPulse & Deals ${{ steps.meta.outputs.TAG }}"
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true' || contains(steps.meta.outputs.TAG, '-') }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
