name: SteamPulse GitHub Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (lämna tomt för automatisk v1.0.<run_number>)'
        required: false
        default: ''
      prerelease:
        description: 'Markera som Pre-release'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build APK & Publish Release Page
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Prepare Firebase config & Permanent Debug Keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          rm -f "app/ google-services.json" "app/google-services(1).json"
          cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "116329660329",
              "project_id": "steampulse-5487d",
              "storage_bucket": "steampulse-5487d.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:116329660329:android:6321124d33eb4f302dceb8",
                  "android_client_info": {
                    "package_name": "com.ferrelicious.steampulse"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "116329660329-4987mmv4f0rb6agl2vagmqdn2e53e4fv.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.ferrelicious.steampulse",
                      "certificate_hash": "51141e2e5601d08962fe750a1c32782693f1444c"
                    }
                  },
                  {
                    "client_id": "116329660329-t26e7dep7ca6jh0s1bmfft8k2bvlfu6k.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.ferrelicious.steampulse",
                      "certificate_hash": "839cb61c0e08e1ed151b69cf71abe745c3f4d844"
                    }
                  },
                  {
                    "client_id": "116329660329-3pk93eilel8km7r1sh0u2q6lu9risl2h.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyC72mGEUGWay7DpqiVhWOaiNw8xO-Pe-Ow"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "116329660329-3pk93eilel8km7r1sh0u2q6lu9risl2h.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Använder sparad debug.keystore från GitHub Secrets."
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          mkdir -p ~/.android app
          cp debug.keystore ~/.android/debug.keystore
          cp debug.keystore app/debug.keystore

      - name: Resolve version and release tag
        id: meta
        run: |
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          RUN_NUM="${{ github.run_number }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            VERSION="${TAG#v}"
          else
            VERSION="1.0.${RUN_NUM}"
            TAG="v1.0.${RUN_NUM}"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              SUFFIX=$(date -u +%Y%m%d%H%M%S)
              VERSION="1.0.${RUN_NUM}.${SUFFIX}"
              TAG="v${VERSION}"
            fi
          fi
          echo "Resolved VERSION=$VERSION, VERSION_CODE=$RUN_NUM, TAG=$TAG"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION_CODE=$RUN_NUM" >> "$GITHUB_OUTPUT"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: |
          VERSION="${{ steps.meta.outputs.VERSION }}"
          VERSION_CODE="${{ steps.meta.outputs.VERSION_CODE }}"
          TAG="${{ steps.meta.outputs.TAG }}"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug -PversionName="$VERSION" -PversionCode="$VERSION_CODE"
          else
            gradle assembleDebug -PversionName="$VERSION" -PversionCode="$VERSION_CODE"
          fi
          APK_OUT="app/build/outputs/apk/debug/SteamPulse-${TAG}.apk"
          mv app/build/outputs/apk/debug/app-debug.apk "$APK_OUT"
          echo "================ APK SIGNATURE ================"
          echo "Fil: $APK_OUT (versionName=$VERSION, versionCode=$VERSION_CODE)"
          $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -n 1)/apksigner verify --print-certs "$APK_OUT" | grep -E "SHA-1|SHA-256"
          echo "==============================================="

      - name: Generate release changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          {
            echo "## Vad är nytt i ${{ steps.meta.outputs.TAG }}"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "Förändringar sedan ${PREV_TAG}:"
              echo ""
              COMMITS=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s (%h)" || true)
              if [ -n "$COMMITS" ]; then
                echo "$COMMITS"
              else
                git log -1 --pretty=%B
              fi
            else
              echo "Senaste ändring:"
              echo ""
              git log -1 --pretty=%B
            fi
          } > release_notes.md
          echo "================ RELEASE CHANGELOG ================"
          cat release_notes.md
          echo "==================================================="

      - name: Publish GitHub Release Page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.TAG }}
          name: "SteamPulse & Deals ${{ steps.meta.outputs.TAG }}"
          prerelease: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.prerelease == 'true' || contains(steps.meta.outputs.TAG, '-') }}
          body_path: release_notes.md
          generate_release_notes: false
          files: |
            app/build/outputs/apk/debug/SteamPulse-${{ steps.meta.outputs.TAG }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
